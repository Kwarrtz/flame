[package]
name = "flame"
# version = "0.6.1"
authors = ["Dathan Ault-McCoy"]
edition = "2024"

[profile.profiling]
inherits = "release"
debug = 1

[dependencies]
image = "0.25"
rand = "0.10"
rand_distr = "0.6"
nalgebra = "0.32"
clap = { version = "4.1", features = ["derive"] }
clap-num = "1.0"
serde_json = "1.0"
serde_yaml = "0.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
num-traits = "0.2.15"
thiserror = "2.0.17"
async-channel = "2.5"
flame_macro = { path = "./flame_macro" }
rfd = "0.17"
rusqlite = "0.39"
indicatif = "0.18"
futures = "0.3"

[dependencies.xilem]
git = "https://github.com/linebender/xilem"
rev = "7b2e2738ad83021411ca9dbd0d5bc468316306c0"

[dependencies.kas]
version = "0.17"
features = ["image", "canvas"]
